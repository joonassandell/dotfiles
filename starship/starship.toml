# https://starship.rs/config

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# No empty line before the prompt: zsh adds it itself, except above the first one (.zshrc)
add_newline = false

[aws]
disabled = true

[character]
success_symbol = "[❯](bold #c9ccd9)"
error_symbol = "[❯](bold #ff899d)"