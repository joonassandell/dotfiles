# https://hermes-agent.nousresearch.com/docs/user-guide/features/skins
# https://hermes-agent.nousresearch.com/docs/user-guide/features/skins#on-the-desktop-app

name: joonassandell
description: My custom theme based on Slate. Makes user messages stand out and adds clearer section separation, with less visual clutter in the CLI and desktop app.

colors:
  background: "#0d111700" # Don't visible add bg to keep it transparent in CLI
  banner_border: "#545e6b"
  banner_title: "#7eb8f6"
  banner_accent: "#8ea8ff"
  banner_dim: "#7eb8f6"
  banner_text: "#c9d1d9"
  ui_accent: "#7eb8f6"
  ui_label: "#f7a072"
  ui_ok: "#63d0a6"
  ui_error: "#cf4848"
  ui_warn: "#e6a855"
  prompt: "#c9d1d9"
  input_rule: "#4169e1"
  response_border: "#7eb8f6"
  status_bar_bg: "#151c2f" # E.g. composer, cmdk item & kbd bg
  status_bar_text: "#c9d1d9"
  status_bar_strong: "#7eb8f6"
  status_bar_dim: "#5d6672"
  status_bar_good: "#63d0a6"
  status_bar_warn: "#e6a855"
  status_bar_bad: "#f7a072"
  status_bar_critical: "#ff7a7a"
  session_label: "#7eb8f6"
  session_border: "#545e6b"
  completion_menu_bg: "#151c2f"
  completion_menu_current_bg: "#324867"
  selection_bg: "#3a5375"
  shell_dollar: "#7eb8f6"
  voice_status_bg: "#151c2f"

tool_prefix: " "

customCSS: | # css
  :root {
    --ui-bg-sidebar: #07090e !important;
    --ui-bg-chrome: #0d1117 !important;
    --ui-inline-code-foreground: #7eb8f6 !important;
    --ui-selection-background: #7eb8f64d !important;

    /* E.g. kanban bg */
    --ui-surface-background: var(--ui-bg-chrome);

    /* E.g. composer bg, kanban bg, code block, "↓ message" popover bg */
    --ui-bg-editor: var(--ui-bg-elevated) !important;

     /* E.g. cmdk item active bg */
    --theme-accent-soft: #272e3b !important;

    /* E.g. kbd bg, quota card bg, popover bg */
    --theme-elevated-seed: #151c2f !important;

    /* E.g. tabs active border and sidebar subtitle. Otherwise inherits from ui_accent. */
    --theme-primary: #c9d1d9 !important;

    /* E.g. cmdk bg and chat bubble */
    --theme-bubble-seed: var(--theme-elevated-seed) !important;

    /* E.g. composer border, kbd border, scheduled dialog border */
    --theme-stroke-secondary-accent-mix: 8% !important;

    /* E.g. chat bubble and sidebar separator border */
    --theme-stroke-tertiary-accent-mix: 5% !important;

    /* E.g. slash cmd in chat bubble, composer icons in slash popover */
    --theme-warm: var(--theme-primary) !important;

    /* E.g. cmdk top border, in settings "mixture of agents enabled box" */
    --dt-border: var(--ui-stroke-secondary) !important;

    /* e.g. some badges in capabilities and settings */
    --dt-muted: var(--ui-bg-elevated) !important;

    /* E.g. switch bg */
    --dt-input: var(--dt-border) !important;

    /* E.g. composer bg, "↓ message" popover bg only if needed */
    /* --dt-card: var(--ui-bg-elevated) !important; */

    /* Increase border radius slightly */
    --radius-scalar: 0.4 !important;
  }

  /* User message chat bubble */
  [data-slot=aui_user-message-root] {
    --dt-foreground: #dd9b77;
  }

  /* Enhance kbd contrast */
  [data-slot=kbd] {
    color: var(--ui-text-primary);
  }

  /* Add proper border color to cmdk */
  [role=dialog]:has([data-slot=command-list]) {
    border-color: var(--ui-stroke-secondary);
  }

  /* No need for scrollbars. Fixes unnecessary scrollgaps and gives more space. */
  * {
    scrollbar-width: none;
  }

  /* Remove kdb from cmdk */
  [data-slot=command-list] {
    [data-slot=kbd] {
      display: none;
    }
  }

  /* Add less distractive composer on scroll, i.e. disable scroll fx */
  [data-slot=composer-root] {
    --composer-fill: var(--dt-card) !important;
  }

  [data-slot=composer-fade] {
    opacity: 1;
  }

  /* Remove distractive composer focus outline */
  [data-slot=composer-surface]:has([data-slot=composer-rich-input]:focus-visible) {
    --dt-composer-ring: var(--ui-stroke-secondary) ;
  }

  /* Disable the highlight in "active project" */
  [data-slot=sidebar-group] [data-slot="context-menu-trigger"] {
    [data-slot="row-button"] span:not(:hover) {
      color: var(--ui-text-secondary);
    }
  }

  /* Clean up sidebar */
  [data-sidebar=content] {
    > [data-slot=sidebar-group]:first-child {
      padding-top: calc(var(--spacing) * 2);
      padding-bottom: calc(var(--spacing) * 4);

      /* Show only wanted top nav items */
      li:not(:has(
        [data-tour="sidebar-nav-artifacts"],
        [data-tour="sidebar-nav-capabilities"],
        [data-tour="sidebar-nav-cron"],
        [data-tour*="kanban"]
      )) {
        display: none;
      }
    }

    /* Search */
    > div:nth-child(2) {
      display: none;
    }
  }

  /* Set nicer radius and container around the chat */
  :root {
    --ui-editor-surface-background: var(--ui-bg-sidebar);
    --sticky-human-top: calc(var(--spacing) * 6);
    --composer-shell-pad-block-end: calc(var(--spacing) * 4);
  }

  [data-zone-header]:has([data-composer-target]) {
    > div:nth-child(2) > div {
      border-width: 1px;
      border-radius: calc(var(--radius-scalar) * 3rem);
      border-end-end-radius: calc(var(--radius-scalar) * 1.5rem);
      margin: 0 calc(var(--spacing) * 2) calc(var(--spacing) * 2) 0;

      :root:has([data-slot="statusbar"]) & {
        margin-bottom: 0;
      }
    }

    [role=tablist] {
      margin-left: calc(var(--spacing) * 2);
      margin-top: 3px;
    }

    [data-slot=context-menu-trigger] {
      [role=tab] {
        &[data-active=true] {
          color: #ffffff;
          box-shadow: unset;
        }
      }
    }
  }

  [data-slot=aui_thread-viewport] {
    padding-inline-start: calc(var(--spacing) * 2);
    padding-inline-end: calc(var(--spacing) * 2);
  }

  [data-slot=aui_thread-content] [data-slot=aui_message-group]:first-child {
    padding-top: var(--sticky-human-top);
  }

  [data-slot=statusbar] {
    height: calc(var(--spacing) * 8);
  }
