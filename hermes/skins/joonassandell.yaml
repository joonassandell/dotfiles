customCSS: | # css
  :root {
    /* Final surfaces, exact (styles.css otherwise mixes the seeds) */
    /* --ui-bg-chrome: #0d1117 !important; */
    /* --ui-bg-editor: #161b22 !important; */
    /* --ui-bg-elevated: #1c2128 !important; */
    /* --ui-bg-sidebar: #090d13 !important; */
    /* --ui-chat-bubble-background: #1e2a38 !important; */

    /* Seeds, still used by other derived tokens */
    --theme-primary: #c9d1d9 !important;
    --theme-sidebar-seed: #090d13 !important;
    --theme-bubble-seed: #1e2a38 !important;
    --theme-midground: #58a6ff !important;
    --theme-card-seed: #161b22 !important;
    --theme-warm: #c9d1d9 !important;

    /* --theme-background-seed: #0d1117 !important; */
    /* --theme-foreground: #c9d1d9 !important; */
    /* --theme-elevated-seed: #1c2128 !important; */
    /* --theme-secondary: #2a3038 !important; */
    /* --theme-accent-soft: #1e2530 !important; */

    /* Tokens Desktop sets directly */
    /* --dt-muted-foreground: #8b949e !important; */
    --dt-border: #30363d !important;
    --dt-muted: #21262d !important;
    --dt-input: #30363d !important;

    /* --dt-card-foreground: #c9d1d9 !important; */
