# ~/.hermes/hermes-agent/apps/shared/src/theme-presets.ts:525
name: joonassandell
description: My custom theme based on Slate

colors:
  background: "#0d1117"
  banner_border: "#4169e1"
  banner_title: "#7eb8f6"
  banner_accent: "#8EA8FF"
  banner_dim: "#545E6B"
