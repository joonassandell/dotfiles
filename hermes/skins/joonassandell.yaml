name: joonassandell
description: My custom theme based on Slate. Makes user messages stand out and adds clearer section separation, with less visual clutter in the CLI and desktop app.

colors:
  banner_border: "#545E6B"
  banner_title: "#7eb8f6"
  banner_accent: "#8EA8FF"
  banner_dim: "#7eb8f6"
  banner_text: "#c9d1d9"
  ui_accent: "#7eb8f6"
  ui_label: "#F7A072"
  ui_ok: "#63D0A6"
  ui_error: "#cf4848"
  ui_warn: "#e6a855"
  prompt: "#c9d1d9"
  input_rule: "#4169e1"
  response_border: "#7eb8f6"
  status_bar_bg: "#151C2F"
  status_bar_text: "#C9D1D9"
  status_bar_strong: "#7EB8F6"
  status_bar_dim: "#5D6672"
  status_bar_good: "#63D0A6"
  status_bar_warn: "#E6A855"
  status_bar_bad: "#F7A072"
  status_bar_critical: "#FF7A7A"
  session_label: "#7eb8f6"
  session_border: "#545E6B"
  completion_menu_bg: "#151C2F"
  completion_menu_current_bg: "#324867"
  selection_bg: "#3A5375"
  shell_dollar: "#7eb8f6"
  voice_status_bg: "#151C2F"

tool_prefix: " "

customCSS: | # css
  :root {
    --ui-bg-sidebar: #07090e !important;
    --ui-bg-chrome: #0d1117 !important;
    --ui-bg-editor: #161b22 !important;
    --ui-inline-code-foreground: #7eb8f6;

    --theme-primary: #c9d1d9 !important;
    --theme-sidebar-seed: #090d13 !important;
    --theme-bubble-seed: #1e2a38 !important;
    --theme-midground: #58a6ff !important;
    --theme-card-seed: #161b22 !important;
    --theme-warm: #c9d1d9 !important;

    --dt-border: #30363d !important;
    --dt-muted: #21262d !important;
    --dt-input: #30363d !important;
  }

  [data-slot=aui_user-message-root] {
    --dt-user-bubble: hsl(21deg 5% 13%);
    --dt-foreground: hsl(21deg 50% 70%);
    --ui-stroke-tertiary: hsl(21deg 15% 22%);
    --ui-stroke-secondary: hsl(21deg 15% 28%);
  }

  [data-sidebar=content] {
    > [data-slot=sidebar-group]:first-child {
      padding-bottom: calc(var(--spacing) * 4);

      li:nth-child(1),
      li:nth-child(3),
      li:nth-child(6) {
        display: none;
      }
    }

    > div:nth-child(2) {
      display: none;
    }
  }
